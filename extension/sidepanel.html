<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog to Podcast</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <svg class="header-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
      <h1 class="header-title">Blog to Podcast</h1>
    </div>
    <a href="options.html" target="_blank" class="settings-link" title="Settings">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </a>
  </header>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="status-dot" id="statusDot"></span>
    <span class="status-text" id="statusText">Checking backend...</span>
  </div>

  <!-- Warning Banner (hidden by default) -->
  <div class="banner banner-warning hidden" id="apiKeyWarning">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    <span>API keys not configured. <a href="options.html" target="_blank">Open Settings</a></span>
  </div>

  <!-- Error Banner (hidden by default) -->
  <div class="banner banner-error hidden" id="errorBanner">
    <span id="errorText"></span>
    <button class="banner-close" id="errorClose">&times;</button>
  </div>

  <!-- Main Content -->
  <main class="content">
    <!-- URL Field -->
    <div class="field">
      <label class="field-label" for="urlInput">Page URL</label>
      <input type="text" id="urlInput" class="input" readonly placeholder="No active tab detected">
    </div>

    <!-- Language Dropdown -->
    <div class="field">
      <label class="field-label" for="languageSelect">Language</label>
      <select id="languageSelect" class="input select">
        <option value="English">English</option>
      </select>
    </div>

    <!-- Convert Button -->
    <button class="btn btn-primary" id="convertBtn">
      <svg class="btn-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="5 3 19 12 5 21 5 3"/>
      </svg>
      <span id="convertBtnText">Convert to Podcast</span>
    </button>

    <!-- Loading Area -->
    <div class="loading-area hidden" id="loadingArea">
      <div class="spinner"></div>
      <p class="loading-text" id="loadingText">Converting blog to podcast...</p>
      <p class="loading-sub">This may take a minute or two</p>
    </div>

    <!-- Audio Player -->
    <div class="player-area hidden" id="playerArea">
      <div class="player-label">Your Podcast</div>
      <audio id="audioPlayer" controls class="audio-player"></audio>
      <button class="btn btn-secondary" id="downloadBtn">
        <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download MP3
      </button>
    </div>

    <!-- Summary Section -->
    <div class="summary-area hidden" id="summaryArea">
      <button class="summary-toggle" id="summaryToggle">
        <span>Summary</span>
        <svg class="chevron" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
      <div class="summary-content hidden" id="summaryContent">
        <p id="summaryText"></p>
      </div>
    </div>
  </main>

  <script src="sidepanel.js"></script>
</body>
</html>
