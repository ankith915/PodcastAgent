<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog to Podcast - Settings</title>
  <style>
    :root {
      --bg-primary: #1a1a2e;
      --bg-secondary: #16213e;
      --bg-card: #1f2b47;
      --bg-input: #253352;
      --bg-hover: #2a3a5c;
      --text-primary: #e8e8f0;
      --text-secondary: #9ca3b4;
      --text-muted: #6b7280;
      --accent: #6c63ff;
      --accent-hover: #5a52d9;
      --accent-glow: rgba(108, 99, 255, 0.25);
      --success: #34d399;
      --success-bg: rgba(52, 211, 153, 0.12);
      --error: #f87171;
      --error-bg: rgba(248, 113, 113, 0.12);
      --border: #2d3a54;
      --border-focus: #6c63ff;
      --radius: 8px;
      --radius-lg: 12px;
      --transition: 0.2s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 14px;
      line-height: 1.5;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .header {
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .header p {
      color: var(--text-secondary);
      font-size: 13px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 16px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .field-hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .input {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      color: var(--text-primary);
      font-size: 13px;
      font-family: monospace;
      width: 100%;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 20px;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all var(--transition);
      outline: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      flex: 1;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-outline {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .status-msg {
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      margin-top: 16px;
      display: none;
    }

    .status-msg.show { display: block; }
    .status-msg.success { background: var(--success-bg); color: var(--success); }
    .status-msg.error { background: var(--error-bg); color: var(--error); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Blog to Podcast</h1>
      <p>Configure your API keys to enable blog-to-podcast conversion.</p>
    </div>

    <div class="card">
      <div class="card-title">API Keys</div>

      <div class="field">
        <label class="field-label" for="openaiKey">OpenAI API Key</label>
        <input type="password" id="openaiKey" class="input" placeholder="sk-..." autocomplete="off">
        <div class="field-hint">Used for text processing and script generation.</div>
      </div>

      <div class="field">
        <label class="field-label" for="elevenlabsKey">ElevenLabs API Key</label>
        <input type="password" id="elevenlabsKey" class="input" placeholder="Enter your ElevenLabs key" autocomplete="off">
        <div class="field-hint">Used for text-to-speech audio generation.</div>
      </div>

      <div class="field">
        <label class="field-label" for="firecrawlKey">Firecrawl API Key</label>
        <input type="password" id="firecrawlKey" class="input" placeholder="fc-..." autocomplete="off">
        <div class="field-hint">Used for web page content extraction.</div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="saveBtn">Save Keys</button>
      <button class="btn btn-outline" id="testBtn">Test Connection</button>
    </div>

    <div class="status-msg" id="statusMsg"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
